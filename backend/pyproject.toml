google-generativeai = "0.8.3"
googleapis-common-protos = "1.65.0"
grpcio = "1.66.2"
grpcio-status = "1.66.2"
h11 = "0.14.0"
httpcore = "1.0.6"
httplib2 = "0.22.0"
httptools = "0.6.2"
httpx = "0.27.2"
idna = "3.10"
importlib_resources = "6.4.5"
iniconfig = "2.0.0"
itsdangerous = "2.2.0"
Jinja2 = "3.1.4"
jsii = "1.104.0"
Markdown = "3.7"
markdown-it-py = "3.0.0"
MarkupSafe = "3.0.1"
mdurl = "0.1.2"
oauthlib = "3.2.2"
packaging = "24.1"
passlib = "1.7.4"
pipenv = "2024.1.0"
platformdirs = "4.3.6"
pluggy = "1.5.0"
proto-plus = "1.24.0"
protobuf = "5.28.2"
psycopg2-binary = "2.9.10"
publication = "0.0.3"
pyasn1 = "0.6.1"
pyasn1_modules = "0.4.1"
pycparser = "2.22"
pydantic = "2.9.2"
pydantic_core = "2.23.4"
Pygments = "2.18.0"
PyJWT = "2.9.0"
pyparsing = "3.1.4"
python-dateutil = "2.9.0.post0"
python-dotenv = "1.0.1"
python-multipart = "0.0.12"
PyYAML = "6.0.2"
requests = "2.32.3"
requests-oauthlib = "2.0.0"
rich = "13.9.2"
rsa = "4.9"
setuptools = "75.2.0"
shellingham = "1.5.4"
six = "1.16.0"
sniffio = "1.3.1"
SQLAlchemy = "2.0.36"
starlette = "0.38.6"
tqdm = "4.66.5"
typeguard = "2.13.3"
